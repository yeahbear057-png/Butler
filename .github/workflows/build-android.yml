name: 构建 Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 打 tag 时要创建 Release，默认 token 是只读的，必须显式授权
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已就绪，许可已接受），无需额外安装

      - name: 安装依赖
        run: npm ci

      - name: 同步网页资源到 Android 工程
        run: npm run sync

      - name: 还原签名证书（未配置 secrets 时跳过，改用 debug 签名）
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置签名 secrets，将使用 debug 签名（仍可安装）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/butler-release.jks
          {
            echo "storeFile=butler-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties
          echo "已写入签名配置"

      - name: 构建 APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 整理产物
        run: |
          mkdir -p ../out
          cp android/app/build/outputs/apk/release/*.apk ../out/管家-1.0.6.apk || \
          cp android/app/build/outputs/apk/debug/*.apk ../out/管家-1.0.6-debug.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: butler-android
          path: mobile/out/*.apk
          retention-days: 30

      - name: 挂到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/out/*.apk
          generate_release_notes: true
