name: 构建 Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: 安装依赖
        run: npm ci

      - name: 同步网页资源到 Android 工程
        run: npm run sync

      - name: 还原签名证书
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/butler-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=butler-release.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: 构建 APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 整理产物
        run: |
          mkdir -p ../out
          cp android/app/build/outputs/apk/release/*.apk ../out/管家-1.0.6.apk || \
          cp android/app/build/outputs/apk/debug/*.apk ../out/管家-1.0.6-debug.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: butler-android
          path: mobile/out/*.apk
          retention-days: 30

      - name: 挂到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/out/*.apk
          generate_release_notes: true
